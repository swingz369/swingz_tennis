name: Performance Benchmark

# Runs nightly + on every PR to main
on:
  schedule:
    # Every night at 02:30 UTC (low traffic window)
    - cron: '30 2 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Manual trigger for ad-hoc runs

env:
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: 1

jobs:
  benchmark:
    name: Clustering Engine Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      # ═══ Clean:all — garantiert frischer Stand vor jedem Bench-Lauf ═══
      # Entfernt .next, .turbo, coverage, .drizzle, .swc, .eslintcache, .tsbuildinfo,
      # .mdx, node_modules/.cache, .cache, .tmp, OS-Temp-Files, etc.
      # So hat jeder Performance-Lauf identische Ausgangsbedingungen und die
      # Speedup-Vergleiche (baseline / caching / backtracking) sind reproduzierbar.
      - name: Clean:all — fresh state for benchmark
        run: npm run clean:all

      # ═══ Download previous benchmark result (for regression detection) ═══
      - name: Download previous benchmark artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bench-baseline
          path: tests/bench/.previous/
          run-id: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ═══ Run the main 200-member benchmark ═══
      - name: Run clustering benchmark (200 members)
        id: bench-main
        run: |
          npx vitest bench tests/bench/clustering.bench.ts --run 2>&1 | tee bench-main.log
          if [ ! -f tests/bench/.bench-results.json ]; then
            echo "::warning::bench-results.json was not created by vitest bench --run"
            echo "Bench file does not auto-write on --run; this is a known issue."
          fi

      # ═══ Run the scaling benchmark (200/500/1000/2000) ═══
      - name: Run scaling benchmark
        id: bench-scaling
        run: |
          npx vitest bench tests/bench/clustering-scaling.bench.ts --run 2>&1 | tee bench-scaling.log
          if [ ! -f tests/bench/.scaling-results.json ]; then
            echo "::warning::scaling-results.json was not created by vitest bench --run"
          fi

      # ═══ Fallback: restore from vitest bench output if JSON files are missing ═══
      - name: Ensure JSON reports exist
        if: always()
        run: |
          # vitest bench --run does not always trigger afterAll, so JSON files
          # may be missing. In that case, parse the log output.
          if [ ! -f tests/bench/.bench-results.json ]; then
            echo "Creating stub bench-results.json from log output"
            node scripts/extract-bench-from-log.mjs bench-main.log tests/bench/.bench-results.json || echo '{}' > tests/bench/.bench-results.json
          fi
          if [ ! -f tests/bench/.scaling-results.json ]; then
            echo "Creating stub scaling-results.json from log output"
            node scripts/extract-bench-from-log.mjs bench-scaling.log tests/bench/.scaling-results.json || echo '{}' > tests/bench/.scaling-results.json
          fi

      # ═══ Generate perf report (markdown) ═══
      - name: Generate perf report
        if: always()
        run: |
          npx tsx scripts/generate-perf-report.ts || true

      # ═══ Compare with previous run, detect regression ═══
      - name: Detect performance regression
        id: regression
        if: github.event_name == 'pull_request'
        run: |
          node scripts/detect-perf-regression.mjs \
            --current tests/bench/.bench-results.json \
            --previous tests/bench/.previous/.bench-results.json \
            --threshold 0.20 \
            --output tests/bench/.regression-report.json

      # ═══ Post PR comment on regression ═══
      - name: Comment PR on regression
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'tests/bench/.regression-report.json';
            if (!fs.existsSync(reportPath)) {
              console.log('No regression report found, skipping comment');
              return;
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            if (!report.regressed) {
              console.log('No performance regression detected, skipping comment');
              return;
            }
            const lines = [
              '## ⚠️ Performance Regression Detected',
              '',
              `**Threshold:** ${(report.threshold * 100).toFixed(0)}% slowdown`,
              '',
              '| Configuration | Previous | Current | Δ |',
              '|---------------|---------:|--------:|--:|',
            ];
            for (const cmp of report.comparisons) {
              const arrow = cmp.delta_pct > 0 ? '🔴' : '🟢';
              lines.push(`| ${cmp.label} | ${cmp.previous_ms} ms | ${cmp.current_ms} ms | ${arrow} ${cmp.delta_pct.toFixed(1)}% |`);
            }
            lines.push('');
            lines.push('📊 Full report: see workflow artifacts (`bench-baseline`).');
            lines.push('📖 Scaling analysis: [`docs/SCALING_ANALYSIS.md`](../../blob/main/docs/SCALING_ANALYSIS.md)');
            const body = lines.join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ═══ Upload benchmark results as artifact (retention: 90 days for nightly, 14 for PR) ═══
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: |
            tests/bench/.bench-results.json
            tests/bench/.scaling-results.json
            docs/PERFORMANCE_BENCHMARK.md
            bench-main.log
            bench-scaling.log
          retention-days: ${{ github.event_name == 'schedule' && 90 || 14 }}

      # ═══ Fail the job if regression exceeds 50% (hard fail, optional) ═══
      - name: Hard fail on severe regression
        if: github.event_name == 'pull_request'
        run: |
          if [ -f tests/bench/.regression-report.json ]; then
            SEVERE=$(node -e "const r=require('./tests/bench/.regression-report.json'); console.log(r.maxDeltaPct >= 50 ? 1 : 0)")
            if [ "$SEVERE" = "1" ]; then
              echo "::error::Severe performance regression detected (>=50%)"
              cat tests/bench/.regression-report.json
              exit 1
            fi
          fi
