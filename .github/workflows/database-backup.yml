name: 'Database Backup (pg_dump)'

on:
  schedule:
    # Daily at 3:00 AM UTC (4:00/5:00 AM Berlin)
    - cron: '0 3 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  backup:
    name: 'pg_dump SQL Backup'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL client (pg_dump)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in GitHub Settings Secrets."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          FILENAME="swingz_backup_${TIMESTAMP}.dump"

          echo "::group::Running pg_dump..."
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-acl \
            --clean \
            --if-exists \
            --format=custom \
            --compress=9 \
            --file="${FILENAME}"

          FILE_SIZE=$(stat -c%s "${FILENAME}")
          echo "Backup file: ${FILENAME} (${FILE_SIZE} bytes)"
          echo "::endgroup::"

          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          compression-level: 0

      - name: Verify backup integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "::group::Verifying backup integrity..."
          pg_restore --list "$BACKUP_FILE" > /dev/null 2>&1 && \
            echo "Backup integrity verified" || \
            echo "Backup verification warning (non-fatal)"
          echo "::endgroup::"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            core.setFailed(`Database backup failed. Check ${runUrl}`);

  backup-json-to-storage:
    name: 'JSON Export to Supabase Storage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backup]
    if: ${{ !cancelled() && !failure() }}

    steps:
      - name: Trigger Vercel backup endpoint
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL not set - skipping JSON backup"
            exit 0
          fi
          echo "Triggering JSON backup at ${APP_URL}/api/cron/backup..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/backup")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            echo "JSON backup completed successfully"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          else
            echo "JSON backup returned HTTP ${HTTP_CODE}"
            echo "$BODY"
          fi
