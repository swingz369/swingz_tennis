# ═══════════════════════════════════════════════════════════════════════════════
# .github/workflows/ci.yml
# ═══════════════════════════════════════════════════════════════════════════════
#
# Gate every push/PR on typecheck + lint + unit tests, so a red suite (or a
# type/lint error) can never reach main unnoticed — pre-commit's lint-staged
# only covers staged files, so this is the full-repo backstop. E2E smoke only
# runs when the repo
# secrets needed to boot the app (Supabase) are configured — it skips
# gracefully on forks / secret-less runs instead of failing on infra.
# ═══════════════════════════════════════════════════════════════════════════════

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Platzhalter, keine Zugangsdaten. src/__tests__/setup.ts laedt lokal
      # .env.local; in CI gibt es die nicht, und Module wie lib/billing-engine.ts
      # bauen beim Import einen Supabase-Service-Client, der ohne diese Variablen
      # sofort wirft — die Testdatei bricht dann schon vor dem ersten Test ab.
      # Die Werte zeigen bewusst ins Leere: die Unit-Tests mocken den Client, und
      # hasIntegrationEnv() haelt die echten DB-Tests ueber CI=true zurueck
      # (src/__tests__/helpers/integration.ts).
      NEXT_PUBLIC_SUPABASE_URL: 'http://localhost:54321'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-platzhalter-anon-key'
      SUPABASE_SERVICE_ROLE_KEY: 'ci-platzhalter-service-role-key'
      # DATABASE_URL wird hier bewusst NICHT gesetzt. Ein Platzhalter auf
      # localhost sieht fuer die DB-Tests wie eine echte lokale Instanz aus
      # (cross-tenant-isolation.test.ts prueft genau darauf) und laesst sie
      # gegen ins Leere laufen. Fehlt die Variable, ueberspringen sie sich.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Design-Token-Guardrail
        run: bash scripts/check-design-tokens.sh

      # Neue Verstöße brechen (Regel-Severity error); behobene müssen aus der Baseline,
      # sonst dürfte derselbe Import später unbemerkt zurückkommen.
      - name: Architektur-Regeln (dependency-cruiser)
        run: |
          pnpm arch:check
          known=$(jq length .dependency-cruiser-known-violations.json)
          now=$(pnpm -s exec depcruise app components hooks lib src --config .dependency-cruiser.js --output-type baseline | jq length)
          if [ "$now" -lt "$known" ]; then
            echo "::error::Baseline veraltet ($known bekannt, $now übrig) — pnpm arch:baseline ausführen und committen"
            exit 1
          fi

      - name: Unit tests
        run: pnpm test:run

  audit:
    name: Dependency Audit (high+critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=high

  migrations-from-scratch:
    # Beweist, dass supabase/migrations/ eine leere DB in den erwarteten Zustand
    # bringt — die Voraussetzung dafür, dass `supabase db reset` lokal überhaupt
    # eine brauchbare Entwicklungs-DB liefert (docs/ENVIRONMENTS.md).
    # Genau das war bis zur Baseline vom 16.08.2026 nicht der Fall: die erste
    # Migration setzte Tabellen voraus, die keine Migration anlegt.
    name: Migrationen gegen leere DB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Datenbank plus REST (kong, postgrest) und Auth (gotrue) — payment-flow und
      # billing-engine schreiben über den Service-Client und legen Auth-Nutzer an.
      - name: Alle Migrationen von null anwenden
        run: |
          supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --no-seed

      - name: Zugangsdaten des lokalen Stacks übernehmen
        run: |
          supabase status -o json > /tmp/sb.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY /tmp/sb.json)" >> "$GITHUB_ENV"

      - name: Integrationstests gegen die frische DB
        env:
          CI: 'true'
          RUN_DB_INTEGRATION: 'true'
          TEST_DB_SCHEMA_READY: 'true'
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # Offizielle Test-Gläubiger-ID der Bundesbank — schaltet die SEPA-Tests frei.
          SEPA_CREDITOR_ID: DE98ZZZ09999999999
        run: pnpm exec vitest run src/__tests__/integration/ src/__tests__/lib/billing-engine.test.ts

  e2e-smoke:
    name: E2E Smoke (billing-flow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: ${{ vars.RUN_E2E_SMOKE == 'true' }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run billing-flow smoke test
        run: npx playwright test tests/e2e/billing-flow.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
