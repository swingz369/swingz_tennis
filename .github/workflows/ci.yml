# ═══════════════════════════════════════════════════════════════════════════════
# .github/workflows/ci.yml
# ═══════════════════════════════════════════════════════════════════════════════
#
# Gate every push/PR on typecheck + unit tests, so a red suite (or a type
# error) can never reach main unnoticed. E2E smoke only runs when the repo
# secrets needed to boot the app (Supabase) are configured — it skips
# gracefully on forks / secret-less runs instead of failing on infra.
# ═══════════════════════════════════════════════════════════════════════════════

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Design-Token-Guardrail
        run: bash scripts/check-design-tokens.sh

      - name: Unit tests
        run: pnpm test:run

  audit:
    name: Dependency Audit (high+critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high/critical, known next.js CVEs suppressed)
        run: |
          pnpm audit --audit-level=high --json 2>/dev/null | node -e "
          const input = require('fs').readFileSync(0, 'utf8');
          const data = JSON.parse(input);
          // Unfixable CVEs in next@16.2.11 bundled deps (sharp/postcss)
          const ignored = new Set(['GHSA-f88m-g3jw-g9cj', 'GHSA-6g55-p6wh-862q', 'GHSA-r28c-9q8g-f849']);
          const advisories = data.advisories || {};
          const unfiltered = Object.values(advisories).filter(v => !ignored.has(v.github_advisory_id));
          if (unfiltered.length > 0) {
            console.error(unfiltered.length + ' unfixed high/critical vulnerabilities remain');
            process.exit(1);
          }
          console.log('Audit OK (' + (Object.keys(advisories).length - unfiltered.length) + ' known next.js CVEs suppressed)');
          "

  e2e-smoke:
    name: E2E Smoke (billing-flow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: ${{ vars.RUN_E2E_SMOKE == 'true' }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run billing-flow smoke test
        run: npx playwright test tests/e2e/billing-flow.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
