# ═══════════════════════════════════════════════════════════════════════════════
# .github/workflows/ci.yml
# ═══════════════════════════════════════════════════════════════════════════════
#
# Gate every push/PR on typecheck + lint + unit tests, so a red suite (or a
# type/lint error) can never reach main unnoticed — pre-commit's lint-staged
# only covers staged files, so this is the full-repo backstop. E2E smoke only
# runs when the repo
# secrets needed to boot the app (Supabase) are configured — it skips
# gracefully on forks / secret-less runs instead of failing on infra.
# ═══════════════════════════════════════════════════════════════════════════════

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Platzhalter, keine Zugangsdaten. src/__tests__/setup.ts laedt lokal
      # .env.local; in CI gibt es die nicht, und Module wie lib/billing-engine.ts
      # bauen beim Import einen Supabase-Service-Client, der ohne diese Variablen
      # sofort wirft — die Testdatei bricht dann schon vor dem ersten Test ab.
      # Die Werte zeigen bewusst ins Leere: die Unit-Tests mocken den Client, und
      # hasIntegrationEnv() haelt die echten DB-Tests ueber CI=true zurueck
      # (src/__tests__/helpers/integration.ts).
      NEXT_PUBLIC_SUPABASE_URL: 'http://localhost:54321'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-platzhalter-anon-key'
      SUPABASE_SERVICE_ROLE_KEY: 'ci-platzhalter-service-role-key'
      # DATABASE_URL wird hier bewusst NICHT gesetzt. Ein Platzhalter auf
      # localhost sieht fuer die DB-Tests wie eine echte lokale Instanz aus
      # (cross-tenant-isolation.test.ts prueft genau darauf) und laesst sie
      # gegen ins Leere laufen. Fehlt die Variable, ueberspringen sie sich.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Design-Token-Guardrail
        run: bash scripts/check-design-tokens.sh

      - name: Unit tests
        run: pnpm test:run

  audit:
    name: Dependency Audit (high+critical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high/critical)
        run: pnpm audit --audit-level=high

  migrations-from-scratch:
    # Beweist, dass supabase/migrations/ eine leere DB in den erwarteten Zustand
    # bringt — die Voraussetzung dafür, dass `supabase db reset` lokal überhaupt
    # eine brauchbare Entwicklungs-DB liefert (docs/ENVIRONMENTS.md).
    # Genau das war bis zur Baseline vom 16.08.2026 nicht der Fall: die erste
    # Migration setzte Tabellen voraus, die keine Migration anlegt.
    name: Migrationen gegen leere DB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Alle Migrationen von null anwenden
        run: supabase db start && supabase db reset --no-seed

      - name: RLS und Vereinsgrenzen gegen die frische DB prüfen
        env:
          CI: 'true'
          TEST_DB_SCHEMA_READY: 'true'
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm exec vitest run src/__tests__/integration/rls-policy-catalog.test.ts src/__tests__/integration/cross-tenant-isolation.test.ts

  e2e-smoke:
    name: E2E Smoke (billing-flow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: ${{ vars.RUN_E2E_SMOKE == 'true' }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run billing-flow smoke test
        run: npx playwright test tests/e2e/billing-flow.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
