# Docker Compose for local test database
# Matches Supabase PostgreSQL 15 configuration
# Usage: docker compose -f docker-compose.test.yml up -d
version: '3.8'

services:
  test-db:
    image: postgres:15
    container_name: swingz-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swingz_test
    ports:
      - '54323:5432'
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d swingz_test']
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=256MB
      -c wal_level=minimal
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off

volumes:
  test-db-data:
