version: '3.8'

services:
  # Frontend - Next.js
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=http://supabase:8000
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzb3dhcHAiLCJpYXQiOjE2OTAwMDAwMDAsImV4cCI6MjAwNTU3NjAwMH0.dummy
    depends_on:
      - supabase
      - redis
      - auth-service
      - scheduling-service

  # Supabase (PostgreSQL + Auth)
  supabase:
    image: supabase/supabase:latest
    environment:
      - POSTGRES_DB=tsow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
      - SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
    ports:
      - "5432:5432"
      - "8000:8000"
    volumes:
      - supabase_data:/var/lib/postgresql/data

  # Redis (Cache + Event Bus)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Auth Microservice (V4)
  auth-service:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=http://supabase:8000
      - JWT_SECRET=tsow-jwt-secret-2026
    ports:
      - "3001:3001"
    depends_on:
      - redis
      - supabase

  # Scheduling Microservice (V4)
  scheduling-service:
    build:
      context: ../services/scheduling
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_URL=http://supabase:8000
    ports:
      - "3002:3002"
    depends_on:
      - redis
      - supabase

  # Billing Microservice (V4)
  billing-service:
    build:
      context: ../services/billing
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=http://supabase:8000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    ports:
      - "3003:3003"
    depends_on:
      - redis
      - supabase

volumes:
  supabase_data:
  redis_data:

networks:
  default:
    name: tsow-network
