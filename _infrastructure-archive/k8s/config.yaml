# k8s/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsow-config
data:
  supabase-url: 'http://supabase.default.svc.cluster.local'
  redis-url: 'redis://tsow-redis:6379'
---
apiVersion: v1
kind: Secret
metadata:
  name: tsow-secrets
type: Opaque
stringData:
  supabase-anon-key: 'your-anon-key'
  supabase-service-key: 'your-service-key'
  jwt-secret: 'your-jwt-secret'
  openai-api-key: 'your-openai-key'
  stripe-secret-key: 'your-stripe-key'
  stripe-webhook-secret: 'your-webhook-secret'
  stripe-basic-price: 'price_basic'
  stripe-premium-price: 'price_premium'
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsow-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsow-frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsow-scheduling-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsow-scheduling-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
