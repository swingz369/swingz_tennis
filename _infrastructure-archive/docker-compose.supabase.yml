version: '3.8'

services:
  supabase-db:
    image: supabase/postgres:15.3.0
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - supabase-db-data:/var/lib/postgresql
      - ./docker/supabase/postgresql.conf:/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: "super-secret-jwt-token-change-in-production"
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  supabase-auth:
    image: supabase/auth:1.0.0
    environment:
      DATABASE_URL: postgres://postgres:postgres@supabase-db:5432/postgres
      JWT_SECRET: "super-secret-jwt-token-change-in-production"
      SUPABASE_URL: http://localhost:54321
      API_EXTERNAL_URL: http://localhost:54321
    ports:
      - "54321:80"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  supabase-db-data:
